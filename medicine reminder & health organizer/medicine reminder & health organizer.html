<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MedCare - Medicine Reminder</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f7f8;
    color: #1f2937;
}

/* HEADER */
header {
    background: #087f5b;
    color: white;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

nav button {
    border: none;
    background: transparent;
    color: white;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 15px;
    border-radius: 6px;
}

nav button:hover {
    background: rgba(255,255,255,0.2);
}

/* MAIN */
.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}

h1 {
    margin-bottom: 25px;
}

h2 {
    margin-bottom: 18px;
    color: #087f5b;
}

/* DASHBOARD */
.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.card h3 {
    font-size: 32px;
    color: #087f5b;
}

.card p {
    margin-top: 5px;
    color: #666;
}

/* PANEL */
.panel {
    background: white;
    padding: 25px;
    margin-bottom: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

/* FORM */
form {
    display: grid;
    gap: 15px;
}

label {
    font-weight: bold;
}

input,
textarea,
select {
    width: 100%;
    margin-top: 7px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

textarea {
    min-height: 90px;
}

.primary {
    background: #087f5b;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.primary:hover {
    background: #066b4d;
}

/* MEDICINE */
.medicine {
    border: 1px solid #ddd;
    padding: 18px;
    margin-bottom: 15px;
    border-radius: 9px;
    display: flex;
    justify-content: space-between;
    gap: 15px;
    align-items: center;
}

.medicine h3 {
    color: #087f5b;
    margin-bottom: 8px;
}

.medicine p {
    margin: 5px 0;
}

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.reminder {
    background: #2563eb;
    color: white;
    border: none;
    padding: 10px 13px;
    border-radius: 6px;
    cursor: pointer;
}

.taken {
    background: #16a34a;
    color: white;
    border: none;
    padding: 10px 13px;
    border-radius: 6px;
    cursor: pointer;
}

.delete {
    background: #dc2626;
    color: white;
    border: none;
    padding: 10px 13px;
    border-radius: 6px;
    cursor: pointer;
}

/* APPOINTMENT */
.appointment {
    border: 1px solid #ddd;
    padding: 18px;
    border-radius: 9px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
}

/* MESSAGE */
.message {
    background: #dcfce7;
    color: #166534;
    padding: 13px;
    border-radius: 7px;
    margin-bottom: 20px;
    display: none;
}

/* EMPTY */
.empty {
    text-align: center;
    color: #777;
    padding: 20px;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 25px;
    color: #777;
    font-size: 13px;
}

/* MOBILE */
@media(max-width: 700px) {

    .cards {
        grid-template-columns: 1fr;
    }

    .medicine {
        flex-direction: column;
        align-items: flex-start;
    }

    .appointment {
        flex-direction: column;
        gap: 15px;
    }

    header {
        flex-direction: column;
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        💊 MedCare
    </div>

    <nav>
        <button onclick="showPage('dashboard')">
            Dashboard
        </button>

        <button onclick="showPage('medicines')">
            Medicines
        </button>

        <button onclick="showPage('addMedicine')">
            Add Medicine
        </button>

        <button onclick="showPage('appointments')">
            Appointments
        </button>
    </nav>

</header>


<div class="container">

    <div id="message" class="message"></div>


    <!-- DASHBOARD -->

    <section id="dashboard">

        <h1>Medicine Reminder & Health Organizer</h1>

        <div class="cards">

            <div class="card">
                <h3 id="medicineCount">0</h3>
                <p>Total Medicines</p>
            </div>

            <div class="card">
                <h3 id="appointmentCount">0</h3>
                <p>Appointments</p>
            </div>

            <div class="card">
                <h3 id="takenCount">0</h3>
                <p>Doses Taken Today</p>
            </div>

        </div>


        <div class="panel">

            <h2>📅 Today's Medicine Schedule</h2>

            <div id="todayMedicines"></div>

        </div>

    </section>



    <!-- MEDICINES -->

    <section id="medicines" style="display:none">

        <h1>💊 My Medicines</h1>

        <div class="panel">

            <div id="medicineList"></div>

        </div>

    </section>



    <!-- ADD MEDICINE -->

    <section id="addMedicine" style="display:none">

        <h1>➕ Add Medicine</h1>

        <div class="panel">

            <form id="medicineForm">

                <label>
                    Medicine Name

                    <input
                        type="text"
                        id="medicineName"
                        placeholder="Example: Paracetamol"
                        required
                    >
                </label>


                <label>
                    Dosage

                    <input
                        type="text"
                        id="dosage"
                        placeholder="Example: 1 tablet"
                        required
                    >
                </label>


                <label>
                    Instructions

                    <input
                        type="text"
                        id="instructions"
                        placeholder="Example: After food"
                    >
                </label>


                <label>
                    Reminder Time

                    <input
                        type="time"
                        id="medicineTime"
                        required
                    >
                </label>


                <label>
                    Start Date

                    <input
                        type="date"
                        id="startDate"
                        required
                    >
                </label>


                <label>
                    End Date

                    <input
                        type="date"
                        id="endDate"
                        required
                    >
                </label>


                <button class="primary" type="submit">
                    Save Medicine
                </button>

            </form>

        </div>

    </section>



    <!-- APPOINTMENTS -->

    <section id="appointments" style="display:none">

        <h1>👨‍⚕️ Doctor Appointments</h1>


        <div class="panel">

            <h2>Add Appointment</h2>

            <form id="appointmentForm">

                <label>
                    Doctor Name

                    <input
                        type="text"
                        id="doctorName"
                        placeholder="Example: Dr. Kumar"
                        required
                    >
                </label>


                <label>
                    Hospital / Clinic

                    <input
                        type="text"
                        id="hospital"
                        placeholder="Hospital name"
                    >
                </label>


                <label>
                    Date

                    <input
                        type="date"
                        id="appointmentDate"
                        required
                    >
                </label>


                <label>
                    Time

                    <input
                        type="time"
                        id="appointmentTime"
                        required
                    >
                </label>


                <label>
                    Notes

                    <textarea
                        id="appointmentNotes"
                        placeholder="Appointment notes">
                    </textarea>
                </label>


                <button class="primary">
                    Save Appointment
                </button>

            </form>

        </div>


        <div class="panel">

            <h2>📅 My Appointments</h2>

            <div id="appointmentList"></div>

        </div>

    </section>

</div>


<footer>

    MedCare © 2026 |
    Medicine organizer and reminder application

</footer>



<script>

/* =====================================
   DATA
===================================== */

let medicines =
    JSON.parse(localStorage.getItem("medicines")) || [];

let appointments =
    JSON.parse(localStorage.getItem("appointments")) || [];

let takenDoses =
    JSON.parse(localStorage.getItem("takenDoses")) || [];



/* =====================================
   PAGE NAVIGATION
===================================== */

function showPage(page) {

    document.getElementById("dashboard").style.display = "none";

    document.getElementById("medicines").style.display = "none";

    document.getElementById("addMedicine").style.display = "none";

    document.getElementById("appointments").style.display = "none";


    document.getElementById(page).style.display = "block";


    updateDashboard();

    displayMedicines();

    displayAppointments();

}



/* =====================================
   MESSAGE
===================================== */

function showMessage(text) {

    const message =
        document.getElementById("message");

    message.innerText = text;

    message.style.display = "block";


    setTimeout(() => {

        message.style.display = "none";

    }, 3000);

}



/* =====================================
   ADD MEDICINE
===================================== */

document
.getElementById("medicineForm")
.addEventListener("submit", function(e) {

    e.preventDefault();


    const medicine = {

        id: Date.now(),

        name:
            document.getElementById("medicineName").value,

        dosage:
            document.getElementById("dosage").value,

        instructions:
            document.getElementById("instructions").value,

        time:
            document.getElementById("medicineTime").value,

        startDate:
            document.getElementById("startDate").value,

        endDate:
            document.getElementById("endDate").value

    };


    medicines.push(medicine);


    localStorage.setItem(
        "medicines",
        JSON.stringify(medicines)
    );


    this.reset();


    showMessage(
        "Medicine added successfully!"
    );


    displayMedicines();

    updateDashboard();

});



/* =====================================
   DISPLAY MEDICINES
===================================== */

function displayMedicines() {

    const list =
        document.getElementById("medicineList");


    if (medicines.length === 0) {

        list.innerHTML =
            `<div class="empty">
                No medicines added yet.
             </div>`;

        return;
    }


    list.innerHTML = "";


    medicines.forEach(medicine => {

        const div =
            document.createElement("div");


        div.className = "medicine";


        div.innerHTML = `

            <div>

                <h3>
                    💊 ${medicine.name}
                </h3>

                <p>
                    <b>Dosage:</b>
                    ${medicine.dosage}
                </p>

                <p>
                    <b>Time:</b>
                    ${medicine.time}
                </p>

                <p>
                    <b>Instructions:</b>
                    ${medicine.instructions || "None"}
                </p>

                <p>
                    <b>Schedule:</b>
                    ${medicine.startDate}
                    to
                    ${medicine.endDate}
                </p>

            </div>


            <div class="actions">

                <button
                    class="reminder"
                    onclick="sendReminder(${medicine.id})">

                    🔔 Remind Me

                </button>


                <button
                    class="taken"
                    onclick="markTaken(${medicine.id})">

                    ✅ Taken

                </button>


                <button
                    class="delete"
                    onclick="deleteMedicine(${medicine.id})">

                    🗑 Delete

                </button>

            </div>

        `;


        list.appendChild(div);

    });

}



/* =====================================
   TODAY'S MEDICINES
===================================== */

function displayTodayMedicines() {

    const container =
        document.getElementById("todayMedicines");


    if (medicines.length === 0) {

        container.innerHTML =
            `<div class="empty">
                No medicines scheduled.
             </div>`;

        return;
    }


    container.innerHTML = "";


    const today =
        new Date().toISOString().split("T")[0];


    let found = false;


    medicines.forEach(medicine => {

        if (
            today >= medicine.startDate &&
            today <= medicine.endDate
        ) {

            found = true;


            const div =
                document.createElement("div");


            div.className = "medicine";


            const isTaken =
                takenDoses.includes(
                    today + "-" + medicine.id
                );


            div.innerHTML = `

                <div>

                    <h3>
                        ${medicine.name}
                    </h3>

                    <p>
                        ${medicine.dosage}
                    </p>

                    <p>
                        ⏰ ${medicine.time}
                    </p>

                </div>


                <div>

                    ${
                        isTaken
                        ?
                        `<button class="taken">
                            ✓ Taken
                         </button>`
                        :
                        `<button
                            class="taken"
                            onclick="markTaken(${medicine.id})">

                            Mark Taken

                         </button>`
                    }

                    <button
                        class="reminder"
                        onclick="sendReminder(${medicine.id})">

                        🔔

                    </button>

                </div>

            `;


            container.appendChild(div);

        }

    });


    if (!found) {

        container.innerHTML =
            `<div class="empty">
                No medicines scheduled for today.
             </div>`;

    }

}



/* =====================================
   MARK MEDICINE TAKEN
===================================== */

function markTaken(id) {

    const today =
        new Date().toISOString().split("T")[0];


    const key =
        today + "-" + id;


    if (!takenDoses.includes(key)) {

        takenDoses.push(key);

        localStorage.setItem(
            "takenDoses",
            JSON.stringify(takenDoses)
        );

        showMessage(
            "Medicine marked as taken."
        );

    }


    updateDashboard();

    displayTodayMedicines();

}



/* =====================================
   DELETE MEDICINE
===================================== */

function deleteMedicine(id) {

    if (
        !confirm(
            "Are you sure you want to delete this medicine?"
        )
    ) {
        return;
    }


    medicines =
        medicines.filter(
            medicine => medicine.id !== id
        );


    localStorage.setItem(
        "medicines",
        JSON.stringify(medicines)
    );


    displayMedicines();

    updateDashboard();


    showMessage(
        "Medicine deleted."
    );

}



/* =====================================
   BROWSER NOTIFICATION
===================================== */

async function sendReminder(id) {

    const medicine =
        medicines.find(
            medicine => medicine.id === id
        );


    if (!medicine) return;


    if (
        !("Notification" in window)
    ) {

        alert(
            "Your browser does not support notifications."
        );

        return;

    }


    if (
        Notification.permission !== "granted"
    ) {

        const permission =
            await Notification.requestPermission();


        if (permission !== "granted") {

            alert(
                "Please allow notifications in your browser."
            );

            return;

        }

    }


    new Notification(
        "💊 Medicine Reminder",
        {
            body:
                `Time to take ${medicine.name} - ${medicine.dosage}`
        }
    );


    showMessage(
        "Reminder notification sent."
    );

}



/* =====================================
   ADD APPOINTMENT
===================================== */

document
.getElementById("appointmentForm")
.addEventListener("submit", function(e) {

    e.preventDefault();


    const appointment = {

        id: Date.now(),

        doctor:
            document.getElementById("doctorName").value,

        hospital:
            document.getElementById("hospital").value,

        date:
            document.getElementById("appointmentDate").value,

        time:
            document.getElementById("appointmentTime").value,

        notes:
            document.getElementById("appointmentNotes").value

    };


    appointments.push(
        appointment
    );


    localStorage.setItem(
        "appointments",
        JSON.stringify(appointments)
    );


    this.reset();


    displayAppointments();

    updateDashboard();


    showMessage(
        "Appointment added successfully."
    );

});



/* =====================================
   DISPLAY APPOINTMENTS
===================================== */

function displayAppointments() {

    const list =
        document.getElementById("appointmentList");


    if (
        appointments.length === 0
    ) {

        list.innerHTML =
            `<div class="empty">
                No appointments added.
             </div>`;

        return;

    }


    list.innerHTML = "";


    appointments.forEach(
        appointment => {

            const div =
                document.createElement("div");


            div.className =
                "appointment";


            div.innerHTML = `

                <div>

                    <h3>
                        👨‍⚕️ Dr. ${appointment.doctor}
                    </h3>

                    <p>
                        🏥 ${appointment.hospital || "Not specified"}
                    </p>

                    <p>
                        📅 ${appointment.date}
                    </p>

                    <p>
                        ⏰ ${appointment.time}
                    </p>

                    <p>
                        📝 ${appointment.notes || "No notes"}
                    </p>

                </div>


                <button
                    class="delete"
                    onclick="deleteAppointment(${appointment.id})">

                    Delete

                </button>

            `;


            list.appendChild(div);

        }
    );

}



/* =====================================
   DELETE APPOINTMENT
===================================== */

function deleteAppointment(id) {

    appointments =
        appointments.filter(
            appointment =>
                appointment.id !== id
        );


    localStorage.setItem(
        "appointments",
        JSON.stringify(appointments)
    );


    displayAppointments();

    updateDashboard();


    showMessage(
        "Appointment deleted."
    );

}



/* =====================================
   DASHBOARD
===================================== */

function updateDashboard() {

    document.getElementById(
        "medicineCount"
    ).innerText =
        medicines.length;


    document.getElementById(
        "appointmentCount"
    ).innerText =
        appointments.length;


    const today =
        new Date().toISOString().split("T")[0];


    const count =
        takenDoses.filter(
            key => key.startsWith(today)
        ).length;


    document.getElementById(
        "takenCount"
    ).innerText =
        count;


    displayTodayMedicines();

}



/* =====================================
   AUTOMATIC REMINDER CHECK
===================================== */

function checkReminders() {

    const now =
        new Date();


    const currentTime =
        now.toTimeString()
        .slice(0,5);


    const today =
        now.toISOString()
        .split("T")[0];


    medicines.forEach(
        medicine => {

            if (
                today >= medicine.startDate &&
                today <= medicine.endDate &&
                medicine.time === currentTime
            ) {

                const key =
                    "notified-" +
                    today +
                    "-" +
                    medicine.id;


                if (
                    !localStorage.getItem(key)
                ) {

                    sendReminder(
                        medicine.id
                    );


                    localStorage.setItem(
                        key,
                        "true"
                    );

                }

            }

        }
    );

}



/* =====================================
   INITIALIZE
===================================== */

updateDashboard();

displayMedicines();

displayAppointments();


/*
   Check reminder every 30 seconds
*/

setInterval(
    checkReminders,
    30000
);

</script>

</body>
</html>
